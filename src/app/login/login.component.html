<section class="login-page">
  <div class="login-card">
    <div class="brand-mark" aria-hidden="true">CP</div>
    <p class="eyebrow">La Casa del Parafuso</p>
    <h1>Iniciar sesión</h1>
    <p class="intro">Ingresá tus credenciales para acceder al sistema.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        type="text"
        formControlName="usuario"
        autocomplete="username"
        placeholder="Tu usuario"
        [attr.aria-invalid]="form.controls.usuario.touched && form.controls.usuario.invalid"
      />
      <small
        class="field-error"
        *ngIf="form.controls.usuario.touched && form.controls.usuario.hasError('required')"
      >
        Ingresá tu usuario.
      </small>

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Tu contraseña"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      <small
        class="field-error"
        *ngIf="form.controls.password.touched && form.controls.password.hasError('required')"
      >
        Ingresá tu contraseña.
      </small>

      <p class="error-message" role="alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button class="submit-button" type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="login-footer">Panel de gestión</p>
  </div>
</section>
